services:
  sql:
    image: sqldbpreview-dpgaeqhmgphzd4bk.azurecr.io/azure-sql/db-dev@sha256:1f6fd8be2c87e0da495f1ca4df01546c091ec7fdb14f16f3f8743b30a9e9266f
    platform: linux/amd64
    pull_policy: never
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:?Explicit SQL terms acceptance required}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run npm run local:init}
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sql-data:/var/opt/mssql
      - ./packages/data:/schema:ro
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-C", "-b", "-l", "2", "-Q", "SELECT 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
volumes:
  sql-data:
