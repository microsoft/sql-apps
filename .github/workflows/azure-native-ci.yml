name: Azure-native validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup-diagnostics:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/setup.test.mjs tests/workspace.test.mjs tests/workspace-runtime.test.mjs
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run dab:validate
      - run: npm run sql:tools
      - run: npm run sql:build
      - run: node scripts/check-application.mjs . sql/obj/Debug/model/model.xml
      - run: az bicep install
      - run: npm run infra:build
      - run: npm run infra:test-demo
