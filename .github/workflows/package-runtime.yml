name: Package SQL Apps runtime
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already set in both package manifests
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: runtime-archive-release
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'microsoft/sql-apps' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Check release version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          for (const file of ['package.json', 'packages/sql-apps/package.json']) {
            const pkg = JSON.parse(await readFile(file, 'utf8'));
            assert.equal(pkg.version, process.env.RELEASE_VERSION, `${file} does not match the requested version`);
          }
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run tooling:build
      - run: npm run tooling:check
      - name: Pack the validated runtime
        run: |
          mkdir -p dist/runtime-release
          npm pack ./dist/tooling-package --ignore-scripts --pack-destination ./dist/runtime-release --json > dist/runtime-release/pack.json
      - name: Verify archive-only creation, handoff and independent restore with empty caches
        run: npm run tooling:verify-archive -- "$PWD/dist/runtime-release/microsoft-sql-apps-${RELEASE_VERSION}.tgz"
      - name: Calculate release checksum
        working-directory: dist/runtime-release
        run: sha256sum "microsoft-sql-apps-${RELEASE_VERSION}.tgz" > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-archive-release
          path: dist/runtime-release/
          if-no-files-found: error
          retention-days: 14
