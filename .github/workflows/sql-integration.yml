name: Real SQL integration
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  sql-integration:
    if: github.repository == 'microsoft/sql-apps' && github.ref == 'refs/heads/main'
    environment: sql-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Authenticate to the private-preview SQL registry
        env:
          ACR_USERNAME: ${{ secrets.SQL_PREVIEW_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.SQL_PREVIEW_ACR_PASSWORD }}
        run: |
          : "${ACR_USERNAME:?Configure SQL_PREVIEW_ACR_USERNAME in the sql-integration environment}"
          : "${ACR_PASSWORD:?Configure SQL_PREVIEW_ACR_PASSWORD in the sql-integration environment}"
          printf '%s' "$ACR_PASSWORD" | docker login sqldbpreview-dpgaeqhmgphzd4bk.azurecr.io --username "$ACR_USERNAME" --password-stdin
      - name: Test pooled identity isolation, cleanup and concurrent quotas
        run: npm run test:sql-integration
      - name: Remove registry credentials
        if: always()
        run: docker logout sqldbpreview-dpgaeqhmgphzd4bk.azurecr.io
